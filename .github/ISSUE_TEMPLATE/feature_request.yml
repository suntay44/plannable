name: Feature request
description: Propose a focused improvement to the CLI, skill, format, or documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification
      description: How would we know this improvement works?
    validations:
      required: true
